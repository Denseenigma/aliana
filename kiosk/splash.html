<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aliana</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  .crow {
    width: 110px;
    height: 92px;
    color: #3fb950;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%   { opacity: 0.35; transform: scale(0.92); }
    50%  { opacity: 1;    transform: scale(1.05); }
    100% { opacity: 0.35; transform: scale(0.92); }
  }
  .label {
    margin-top: 18px;
    color: #7b8798;
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <svg class="crow" viewBox="0 0 120 100" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
    <path d="M30 70 L10 85 L35 78 Z"/>
    <ellipse cx="55" cy="60" rx="22" ry="14" transform="rotate(-10 55 60)"/>
    <path d="M50 50 C40 20, 70 15, 85 35 C70 30, 55 35, 50 50 Z"/>
    <circle cx="82" cy="45" r="11"/>
    <path d="M92 45 L104 42 L92 50 Z"/>
    <path d="M60 72 L58 88 M68 73 L70 89" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>
  <div class="label">starting Aliana&hellip;</div>

<script>
  // Poll the dashboard in the background. As soon as it responds, navigate
  // this same browser window straight to it -- no second Chromium launch
  // needed, which is what made the old kill-and-relaunch approach slow.
  const DASHBOARD_URL = "http://localhost:8080/";
  const POLL_INTERVAL_MS = 500;

  function checkReady() {
    fetch(DASHBOARD_URL, { mode: "no-cors", cache: "no-store" })
      .then(() => { window.location.href = DASHBOARD_URL; })
      .catch(() => { setTimeout(checkReady, POLL_INTERVAL_MS); });
  }
  checkReady();
</script>
</body>
</html>
